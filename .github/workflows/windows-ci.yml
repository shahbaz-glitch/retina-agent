name: Retina Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retina-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-install:
    name: Build, test and install (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_TYPE: Release

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows tools and Boost
        shell: pwsh
        run: |
          choco install ninja ugrep llvm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'VCPKG_INSTALLATION_ROOT is not configured on this runner.'
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-process boost-json --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify required tools
        shell: pwsh
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ugrep --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clangd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure (Windows)
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run integration and adversarial tests
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install runtime to staging directory
        shell: pwsh
        run: |
          cmake --install build --prefix install-root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'install-root/bin/retina-agent.exe')) {
            throw 'Installed Retina executable is missing.'
          }
          & 'install-root/bin/retina-agent.exe' --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installed runtime
        uses: actions/upload-artifact@v7.0.2
        with:
          name: retina-runtime-windows-x64
          path: install-root/
          if-no-files-found: error
          retention-days: 14
